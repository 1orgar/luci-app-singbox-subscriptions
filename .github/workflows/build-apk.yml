name: Build and Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenWrt SDK
        run: |
          # Пример для x86_64, замените под свою архитектуру если нужно
          wget https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar xf openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst --strip-components=1
          rm -f openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

      - name: Setup Keys
        run: |
          echo "${{ secrets.APK_PRIVATE_KEY }}" > private.pem
          # Утилита для подписи ожидает ключ в определенном месте
          mkdir -p ~/.abuild
          cp private.pem ~/.abuild/saved-key.rsa

      - name: Build Package
        run: |
          PKG_NAME="luci-app-singbox-subscriptions"

          # 1. Создаем структуру локального фида ВНЕ папки SDK
          # (Важно: Makefile должен лежать в папке с именем пакета)
          mkdir -p $GITHUB_WORKSPACE/my-repo/$PKG_NAME
          cp $GITHUB_WORKSPACE/Makefile $GITHUB_WORKSPACE/my-repo/$PKG_NAME/
          [ -d "$GITHUB_WORKSPACE/htdocs" ] && cp -r $GITHUB_WORKSPACE/htdocs $GITHUB_WORKSPACE/my-repo/$PKG_NAME/
          [ -d "$GITHUB_WORKSPACE/root" ] && cp -r $GITHUB_WORKSPACE/root $GITHUB_WORKSPACE/my-repo/$PKG_NAME/

          # 2. Подключаем этот фид в SDK через абсолютный путь
          echo "src-link mylocal $GITHUB_WORKSPACE/my-repo" >> feeds.conf.default
          # Добавляем стандартные фиды обратно
          #   echo "src-git base https://openwrt.org" >> feeds.conf.default
          #   echo "src-git luci https://openwrt.org" >> feeds.conf.default

          echo ">> UPDATE FEEDS"

          # 3. Обновляем и индексируем
          ./scripts/feeds update -a
          ./scripts/feeds install -p mylocal -a
          ./scripts/feeds install -a

          echo ">> FEEDS"
          ./scripts/feeds list

          # 4. Проверяем, появился ли пакет в списке
          if ! ./scripts/feeds list | grep -q "$PKG_NAME"; then
            echo "Error: Package not found in feeds!"
            exit 1
          fi

          echo ">> DEFCONFIG"

          # 5. Конфигурация и сборка
          make defconfig
          echo "CONFIG_PACKAGE_$PKG_NAME=y" >> .config
          make defconfig
          
          echo ">> COMPILE"

          # Путь для сборки пакетов из фидов всегда такой:
          make package/feeds/mylocal/$PKG_NAME/compile V=s


      - name: Prepare Repository Structure
        run: |
          mkdir -p deploy/x86_64
          cp bin/packages/x86_64/base/*.apk deploy/x86_64/
          cd deploy/x86_64
          
          # Создаем индекс и подписываем его
          # (Используем контейнер alpine для доступа к инструментам apk)
          docker run --rm -v $(pwd):/work -w /work alpine:latest sh -c "
            apk add apk-tools abuild
            apk index -o APKINDEX.tar.gz *.apk
            abuild-sign APKINDEX.tar.gz
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
