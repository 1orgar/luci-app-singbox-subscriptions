name: Build and Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenWrt SDK
        run: |
          # Пример для x86_64, замените под свою архитектуру если нужно
          wget https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar xf openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst --strip-components=1
          rm -f openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

      - name: Setup Keys
        run: |
          echo "${{ secrets.APK_PRIVATE_KEY }}" > private.pem
          # Утилита для подписи ожидает ключ в определенном месте
          mkdir -p ~/.abuild
          cp private.pem ~/.abuild/saved-key.rsa

      - name: Build Package
        run: |
          PKG_NAME="luci-app-singbox-subscriptions"
          
          # 1. Сначала обновляем стандартные фиды, чтобы папка feeds/luci появилась
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2. Теперь копируем ваш проект ПРЯМО в фид LuCI
          # Это обманывает систему сборки, заставляя её думать, что это часть стандартного LuCI
          DEST_DIR="feeds/luci/applications/$PKG_NAME"
          mkdir -p "$DEST_DIR"
          cp $GITHUB_WORKSPACE/Makefile "$DEST_DIR/"
          cp -r $GITHUB_WORKSPACE/htdocs "$DEST_DIR/"
          cp -r $GITHUB_WORKSPACE/root "$DEST_DIR/"

          # 3. Переиндексируем фиды, чтобы наш пакет появился в меню
          ./scripts/feeds install -p luci $PKG_NAME
          
          # 4. Включаем его в конфиг
          echo "CONFIG_PACKAGE_$PKG_NAME=y" >> .config
          make defconfig
          
          # 5. Сборка (теперь путь будет именно таким)
          make package/feeds/luci/$PKG_NAME/compile V=s || (echo "Логи сборки выше"; exit 1)


      - name: Prepare Repository Structure
        run: |
          mkdir -p deploy/x86_64
          cp bin/packages/x86_64/base/*.apk deploy/x86_64/
          cd deploy/x86_64
          
          # Создаем индекс и подписываем его
          # (Используем контейнер alpine для доступа к инструментам apk)
          docker run --rm -v $(pwd):/work -w /work alpine:latest sh -c "
            apk add apk-tools abuild
            apk index -o APKINDEX.tar.gz *.apk
            abuild-sign APKINDEX.tar.gz
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
