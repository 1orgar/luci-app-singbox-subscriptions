name: Build and Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenWrt SDK
        run: |
          mkdir sdk
          cd sdk

          # Пример для x86_64, замените под свою архитектуру если нужно
          wget https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar xf openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst --strip-components=1
          rm -f openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst


      - name: Setup Keys
        run: |
          mkdir pk
          echo "${{ secrets.APK_PRIVATE_KEY }}" > pk/private.pem
          chmod 600 pk/private.pem
          # Утилита для подписи ожидает ключ в определенном месте

      - name: Build Package
        run: |
          cd sdk
          PKG_NAME="luci-app-singbox-subscriptions"

          mkdir -p package/myapp
          
          cp ../Makefile package/myapp/
          cp -r ../htdocs package/myapp/
          cp -r ../root package/myapp/

          chmod +x package/myapp/root/usr/bin/singbox-update 2>/dev/null || true

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

          echo "CONFIG_PACKAGE_$PKG_NAME=y" >> .config
          echo "CONFIG_PACKAGE_apk=y" >> .config

          make package/myapp/compile V=s

      - name: Prepare Repository Structure
        run: |
          KEY_DIR=$(pwd)/pk
          mkdir -p deploy/x86_64
          cp sdk/bin/packages/x86_64/base/*.apk deploy/x86_64/
          cd deploy/x86_64

          # Создаем индекс и подписываем его
          # (Используем контейнер alpine для доступа к инструментам apk)
          docker run --rm -v $KEY_DIR:/key -v $(pwd):/work -w /work alpine:latest sh -c "
            apk add apk-tools abuild
            apk mkndx --allow-untrusted -o APKINDEX.tar.gz *.apk
            abuild-sign -k /key/private.pem APKINDEX.tar.gz
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
